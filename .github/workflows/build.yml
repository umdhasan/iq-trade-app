name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Prepare Project and Missing Files
      run: |
        # যদি রিপোজিটরিতে জিপ ফাইলটি থেকে থাকে, তবে সেখান থেকে সব ফাইল নিখুঁতভাবে বের করে নেওয়া হবে
        if [ -f "IQ_Option_App.zip" ]; then
          unzip -o IQ_Option_App.zip
        fi

    - name: Build Debug APK with Gradle
      run: |
        if [ -d "iq" ] && [ -f "iq/settings.gradle.kts" ]; then
          cd iq && gradle assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
