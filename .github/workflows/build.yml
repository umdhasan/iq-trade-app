name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find and grant execute permission for gradlew
      run: |
        find . -name "gradlew" -exec chmod +x {} +

    - name: Build Debug APK with Gradle
      run: |
        # এটি স্বয়ংক্রিয়ভাবে প্রজেক্টের যেকোনো স্থান থেকে gradlew খুঁজে বের করে বিল্ড করবে
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        elif [ -f "./iq-trade-app/gradlew" ]; then
          cd iq-trade-app && ./gradlew assembleDebug
        else
          find . -name "gradlew" -execdir ./gradlew assembleDebug \;
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
