name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Build Debug APK with Gradle
      run: |
        if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
          gradle assembleDebug
        elif [ -d "iq" ]; then
          cd iq && gradle assembleDebug
        elif [ -d "iq-trade-app" ]; then
          cd iq-trade-app && gradle assembleDebug
        else
          PROJECT_DIR=$(dirname $(find . -name "settings.gradle*" | head -n 1))
          cd "$PROJECT_DIR" && gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
